name: 'tests'
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
permissions:
  contents: read
jobs:
  tests:
    strategy:
      # One failing leg must not cancel the other five: a platform-specific
      # failure otherwise hides whether the rest of the matrix is healthy.
      fail-fast: false
      matrix:
        node_version: ['20', '22', '24']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

      - name: Verify the published package
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == '22'
        run: npm run smoke
